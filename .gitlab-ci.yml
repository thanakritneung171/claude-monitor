# CI/CD ของ Cloudflare Worker (worker/) — claude-monitor-hooks
#
#   check   ทุก MR และทุก push ที่แก้ worker/  → typecheck + test + bundle (dry-run)
#   deploy  เฉพาะ push เข้า master ที่แก้ worker/ → wrangler deploy ขึ้น production
#
# ต้องตั้งก่อนใช้ (GitLab → Settings → CI/CD → Variables):
#   CLOUDFLARE_API_TOKEN  token แบบ "Edit Cloudflare Workers" ของ account
#                         Cloudflare Training3 — ติ๊ก Masked + Protected
#   (account_id อยู่ใน worker/wrangler.jsonc แล้ว ไม่ต้องตั้งซ้ำ)
#   master ต้องเป็น protected branch (Settings → Repository) ไม่งั้น job บน master
#   จะไม่เห็น variable ที่ติ๊ก Protected
#   runner: ใช้ runner ที่มี tag "deploy" (#69) — Settings → CI/CD → Runners
#
# D1 migration (worker/migrations/*.sql) ยังรันมือผ่าน npm run db:* เหมือนเดิม —
# pipeline นี้ deploy เฉพาะโค้ด worker

stages:
  - check
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never            # มี MR เปิดอยู่ → ใช้ pipeline ของ MR อย่างเดียว ไม่รันซ้ำ
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  WRANGLER_SEND_METRICS: "false"
  # Node + npm มาจาก registry.npmjs.org เพราะ gitlab-server ต่อ nodejs.org ไม่ได้ (connection reset)
  # ตรวจแล้ว 2026-11-12: bin/node ใน node-linux-x64 ตรงกับ tarball ทางการของ nodejs.org ทุก byte
  # (sha256 c43f3f73…8716) และ npm 10.9.2 ตรงกับตัวที่มากับ Node 22.15.0 (ต่างแค่ whitespace)
  NODE_VERSION: "22.15.0"
  NPM_VERSION: "10.9.2"
  NODE_PKG_SHA512: "cceaf50599f1c1c254b08c4840afcc75128c500520eace5899586afa73057a2a5b13d9849c8343dfdcb75c2d191e0dc8818e20017615024e666c9312c4aa1bdc"
  NPM_PKG_SHA512: "8ab88f10f224a0c614cb717a7f7c30499014f77134120e9c1f0211ea3cf3397592cbe483feb38e0c4b3be1c54e347292c76a1b5edb94a3289d5448484ab8ac81"

.worker:
  image: node:22          # ใช้เมื่อ runner เป็น Docker executor (Debian/glibc — workerd รันบน alpine ไม่ได้)
  tags:
    - deploy
  before_script:
    # runner #69 เป็น shell executor บน gitlab-server ที่ไม่มี Node — ถ้าไม่มี npm ให้ประกอบ
    # Node + npm จาก registry.npmjs.org (เช็ค sha512 ที่ล็อกไว้) เก็บใน ~/.cache/ci-node ใช้ซ้ำรอบถัดไป
    - |
      if ! command -v npm >/dev/null 2>&1; then
        NODE_HOME="$HOME/.cache/ci-node/node-v${NODE_VERSION}-npm-${NPM_VERSION}"
        if [ ! -x "$NODE_HOME/bin/node" ] || [ ! -e "$NODE_HOME/bin/npm" ]; then
          echo "Node ${NODE_VERSION} not on runner - fetching from registry.npmjs.org"
          REG="https://registry.npmjs.org"
          DL="$(mktemp -d)"
          curl -fsSL -o "$DL/node.tgz" "$REG/node-linux-x64/-/node-linux-x64-${NODE_VERSION}.tgz"
          echo "${NODE_PKG_SHA512}  $DL/node.tgz" | sha512sum -c -
          curl -fsSL -o "$DL/npm.tgz" "$REG/npm/-/npm-${NPM_VERSION}.tgz"
          echo "${NPM_PKG_SHA512}  $DL/npm.tgz" | sha512sum -c -
          mkdir -p "$DL/node/lib/node_modules/npm"
          tar -xzf "$DL/node.tgz" -C "$DL/node" --strip-components=1
          tar -xzf "$DL/npm.tgz" -C "$DL/node/lib/node_modules/npm" --strip-components=1
          chmod +x "$DL/node/bin/node" "$DL/node/lib/node_modules/npm/bin/npm-cli.js" "$DL/node/lib/node_modules/npm/bin/npx-cli.js"
          ln -sf ../lib/node_modules/npm/bin/npm-cli.js "$DL/node/bin/npm"
          ln -sf ../lib/node_modules/npm/bin/npx-cli.js "$DL/node/bin/npx"
          mkdir -p "$HOME/.cache/ci-node"
          rm -rf "$NODE_HOME" && mv "$DL/node" "$NODE_HOME"
          rm -rf "$DL"
        fi
        export PATH="$NODE_HOME/bin:$PATH"
      fi
    - node --version && npm --version
    - cd worker
    - npm ci --no-audit --no-fund
  cache:
    key:
      files:
        - worker/package-lock.json
    paths:
      - .npm/

worker:check:
  extends: .worker
  stage: check
  script:
    - npm run typecheck
    - npm test
    - npm run build:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - worker/**/*
        - .gitlab-ci.yml

worker:deploy:
  extends: .worker
  stage: deploy
  needs: ["worker:check"]
  resource_group: cloudflare-production   # deploy ทีละรอบ ไม่ชนกัน
  environment:
    name: production
    url: https://claude-monitor-hooks.cloudflare-training3.workers.dev
  script:
    - 'test -n "$CLOUDFLARE_API_TOKEN" || { echo "ยังไม่ได้ตั้ง CLOUDFLARE_API_TOKEN ใน GitLab CI/CD Variables"; exit 1; }'
    - npx wrangler deploy
  rules:
    # default branch ของโปรเจกต์คือ main (มีแค่ Initial commit) — ระบุ master ตรง ๆ
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - worker/**/*
        - .gitlab-ci.yml
