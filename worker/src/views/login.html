<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SDB AI Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>{{css}}</style>
</head>
<body>
<main class="login-shell">
	<div class="login-card">
		<div class="brand">
			<div class="logo" aria-hidden="true">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<polygon points="12 2 22 8 22 16 12 22 2 16 2 8 12 2"></polygon>
				</svg>
			</div>
			<div>
				<h1>SDB AI Insight</h1>
				<p>Analytics Platform</p>
			</div>
		</div>

		<h2>Sign in to your account</h2>
		<p class="sub">เข้าสู่ระบบเพื่อดู dashboard ของ Claude API monitoring</p>

		{{errorBanner}}

		<form method="post" action="/login" autocomplete="on" novalidate>
			<input type="hidden" name="next" value="{{next}}">
			<label class="field">
				<span>Email</span>
				<input class="input" type="email" name="email" autocomplete="email" required autofocus placeholder="you@company.com" value="{{emailVal}}">
			</label>
			<label class="field">
				<span>Password</span>
				<input class="input" type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
			</label>
			<button type="submit" class="btn primary">
				Sign in
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
			</button>
		</form>

		<p class="foot">หากเป็นการเข้าใช้งานครั้งแรก กรุณาติดต่อ administrator เพื่อขอบัญชี</p>
	</div>
</main>
</body>
</html>
